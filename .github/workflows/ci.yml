# CI: the fast suites of docs/dev/TESTS-ja.md on Linux and macOS, and the build of the Rust VM on Windows,
# for every pull request and every push of alpha (docs/dev/CONTRIBUTING.md, Tests, 2026-11-22).
# It does not replace the Full Test: a commit is tested only by a Full Test, which also runs the Python VM,
# the transpiled VM, the reference versions and the benchmarks' builds, none of which is here.
name: CI

on:
  pull_request:
  push:
    branches: [alpha]
  workflow_dispatch:

permissions:
  contents: read

# A newer push of the same branch or pull request replaces a run that has not finished
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      # consh/js/test runs `n = 1 + 2` and expects that no command n exists, but the runner of Ubuntu has one
      # (a version manager of Node.js, /usr/local/bin/n). Take it away, as no machine of the developers has it.
      - name: Remove the command n
        run: if command -v n; then sudo rm -f "$(command -v n)"; fi

      # The Rust VM, then the wasm32 VM with its host and the module of ConSh (consh/js/build.sh)
      - name: Build
        id: build
        run: |
          rustup target add wasm32-unknown-unknown
          (cd vm && cargo build --release)
          consh/js/build.sh

      - name: vm (cargo test)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cd vm && cargo test --release

      # step31 sends SIGINT twice and may see it once on a busy machine (docs/dev/TESTS-ja.md, 既知の違い)
      - name: test/ (Rust VM)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CONMA_VM=rust .github/ci-suite.sh "step31" test/run_all.sh -j 4

      - name: test/ (wasm VM)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CONMA_VM=wasm .github/ci-suite.sh "step31 step40" test/run_all.sh -j 3

      - name: consh/test (Rust VM)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CONMA_VM=rust .github/ci-suite.sh "" consh/test/run_all.sh -j 4

      - name: consh/test (wasm VM)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CONMA_VM=wasm .github/ci-suite.sh "step8 step17" consh/test/run_all.sh -j 3

      - name: consh/js/test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/ci-suite.sh "" consh/js/test/run_all.sh

      - name: sjs/test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/ci-suite.sh "" sjs/test/run_all.sh

      - name: conjs/test (Rust VM)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/ci-suite.sh "" conjs/test/run_all.sh

      - name: conjs/test (wasm VM)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CONMA_VM=wasm .github/ci-suite.sh "" conjs/test/run_all.sh

      - name: test/host-api.sh
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/ci-suite.sh "" bash test/host-api.sh

  # The Rust VM does not build on Windows until stage P6c (docs/dev/PLATFORM-PLAN-ja.md, section 4.11): until then a failure
  # of the step does not fail the job (a warning is shown on it). When P6c is done, remove continue-on-error and add the suites I7 can run.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build the Rust VM
        continue-on-error: true
        run: cd vm && cargo build --release
