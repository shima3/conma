# GitHub Pages: publish docs/ (made into HTML by Jekyll, as before), the browser version of ConSh
# (consh/js/web, with the files that consh/js/build.sh makes) at consh/web/, and the documents of ConJS and SJS
# (conjs/README.md and README-ja.md, sjs/README-ja.md) with the pages of vm/wasm/web (made by vm/wasm/web/build.sh) at conjs/.
# Only main is published, which gets only states that passed every suite (docs/dev/CONTRIBUTING.md).
# A pull request runs the build only (Jekyll of GitHub included), so that a page that stops it is seen before the merge,
# with no Jekyll on the machines of the developers (2026-11-23).
# The repository's Settings -> Pages -> Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push of main replaces one that is waiting.
# A pull request has a group of its own, and its newer push cancels the build that runs.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wasm32 VM (vm/wasm), its host conma.js and the module of ConSh, into consh/js/web
      # (bin/includer and bin/resolver need Python 3 only, which the runner has)
      - name: Build the browser version of ConSh
        run: |
          rustup target add wasm32-unknown-unknown
          consh/js/build.sh

      # Jekyll copies the files of the page as they are (index.html has no front matter).
      # config.json is not put there, so js and the SJS of the host stay off (consh/js/README-ja.md).
      - name: Put the browser version under docs/consh/web
        run: cp -R consh/js/web docs/consh/web

      # The pages run ConJS programs, which conjs/conjs --emit translates with the Rust VM
      - name: Build the pages of ConJS
        run: |
          (cd vm && cargo build --release)
          vm/wasm/web/build.sh

      # docs/conjs/index.md lists them. The links of the READMEs are relative to conjs/ and sjs/ of the repository:
      # those into docs/ stay on this site, and those to what is not published here go to GitHub (alpha)
      - name: Put the documents and the pages of ConJS under docs/conjs and docs/sjs
        run: |
          mkdir -p docs/sjs
          gh=https://github.com/shima3/conma/blob/alpha
          # A README.md without front matter is not made into a page (jekyll-optional-front-matter leaves README
          # files alone; the site served conjs/README.md as it is, 2026-11-23), so each copy gets a title
          for f in conjs/README.md conjs/README-ja.md sjs/README-ja.md; do
            printf -- '---\ntitle: %s\n---\n' "$(dirname "$f" | sed -e 's/conjs/ConJS/' -e 's/sjs/SJS/')" > "docs/$f"
            sed -e "s|](\.\./docs/dev/|]($gh/docs/dev/|g" -e "s|](\.\./docs/consh/dev/|]($gh/docs/consh/dev/|g" \
                -e "s|](\.\./docs/|](../|g" -e "s|](\.\./consh/|]($gh/consh/|g" \
                "$f" >> "docs/$f"
          done
          cp -R vm/wasm/web docs/conjs/web

      # Jekyll reads every page as Liquid first, and the text of ConSh has {{ and {% in it
      # (docs/consh/PLAN-ja.md, docs/dev/TESTS-RECORD-ja.md), so each of them is escaped, here only (.github/pages-escape.py)
      - name: Keep Liquid out of the Markdown
        run: python3 .github/pages-escape.py docs

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site

      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
